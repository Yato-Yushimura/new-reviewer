<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Arnis Practice Quiz</title>
<style>
:root{--bg:#1c2310;--surf:#27311a;--surf2:#313d20;--sel:#3b4b22;--line:#4a5a2e;--text:#eef2dc;--mute:#b6c19a;--lime:#a8d044;--gold:#f2c230;--ok:#8fd36b;--okbg:#213719;--bad:#ff8f7d;--badbg:#3e2521;--r:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:760px;margin:0 auto;padding:22px 16px 56px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.25;margin:0;font-weight:700}
h1{font-size:clamp(1.8rem,6.4vw,2.7rem);color:var(--gold)}
h3{font-size:1.2rem;color:var(--lime);margin-bottom:10px}
p{margin:0}
.sub{color:var(--mute);margin:10px 0 22px;max-width:60ch}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-family:Georgia,"Times New Roman",serif;font-size:1.2rem;font-weight:700;color:var(--lime);padding:0;margin-bottom:12px}
.opts{display:grid;gap:10px}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{display:flex;gap:12px;align-items:flex-start;min-height:48px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surf2);cursor:pointer;overflow-wrap:anywhere}
.opt input{flex:none;width:20px;height:20px;margin:2px 0 0;accent-color:var(--lime)}
.opt small{display:block;color:var(--mute);font-size:.88rem;margin-top:2px}
.opt:has(input:checked){border-color:var(--lime);background:var(--sel)}
.opt:focus-within{outline:3px solid var(--gold);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:has(input:disabled){cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{font:inherit;min-height:44px;min-width:56px;padding:0 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--surf2);color:var(--text);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:#18200c;font-weight:600}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row label{font-weight:600}
input[type=text],input[type=number],select{font:inherit;font-size:16px;width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surf2);color:var(--text)}
input[type=number]{width:110px}
select{overflow:hidden;text-overflow:ellipsis}
select:disabled,input[type=text]:disabled{opacity:1;color:var(--text)}
option{background:#27311a;color:#eef2dc}
input.ok,select.ok{border-color:var(--ok);background:var(--okbg)}
input.bad,select.bad{border-color:var(--bad);background:var(--badbg)}
.hintline{color:var(--mute);font-size:.92rem;margin-top:8px}
.btn{font:inherit;font-weight:600;min-height:48px;padding:0 24px;border-radius:12px;border:1.5px solid var(--lime);background:var(--lime);color:#18200c;cursor:pointer}
.btn.sec{background:transparent;color:var(--text);border-color:var(--line)}
.btn.sm{min-height:40px;padding:0 16px;font-size:.92rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.map button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.wide{width:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.brand{font-family:Georgia,"Times New Roman",serif;color:var(--gold);font-size:1.05rem}
.bar{height:8px;background:var(--surf2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);transition:width .3s}
.qhead{display:flex;justify-content:space-between;gap:12px;color:var(--mute);font-size:.93rem;margin:10px 0 14px}
.qtype{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 12px;font-size:.85rem;color:var(--gold);white-space:nowrap}
.qtext{font-size:clamp(1.15rem,3.8vw,1.45rem);line-height:1.4;margin:12px 0 6px;font-weight:600}
.qtext:focus{outline:none}
.match{display:grid;gap:14px}
.match label{display:block;font-weight:600;margin-bottom:6px}
.fb{margin-top:16px;padding:14px;border-radius:12px;border-left:5px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.bad{background:var(--badbg);border-color:var(--bad)}
.fb strong{display:block;margin-bottom:4px}
.fb p+p{margin-top:6px}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.map{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.map button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surf2);color:var(--text);font:inherit;font-size:.9rem;cursor:pointer}
.map button.done{background:var(--sel);border-color:var(--lime)}
.map button.cur{outline:2px solid var(--gold);outline-offset:1px}
.score{font-family:Georgia,"Times New Roman",serif;font-size:clamp(3rem,15vw,5rem);line-height:1;color:var(--gold);font-weight:700}
.center{text-align:center}
table{width:100%;border-collapse:collapse}
td{padding:9px 6px;border-top:1px solid var(--line);vertical-align:top}
tr:first-child td{border-top:0}
td.num{text-align:right;white-space:nowrap;color:var(--mute)}
.rev{background:var(--surf);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.rev.ok{border-left-color:var(--ok)}
.rev.bad{border-left-color:var(--bad)}
.revhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.rq{font-weight:600;margin-bottom:10px}
.ans{margin-top:8px;overflow-wrap:anywhere}
.ans b{display:block;color:var(--lime);font-size:.88rem}
.ex{margin-top:10px;color:var(--mute);font-size:.95rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.figs{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.figs figure{margin:0;text-align:center;max-width:100%}
.figs img{display:block;max-height:260px;max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff}
.figs img.wide{max-height:340px}
figcaption{color:var(--mute);font-size:.88rem;margin-top:5px;max-width:240px;margin-inline:auto}
@media print{:root{--bg:#fff;--surf:#fff;--surf2:#fff;--line:#999;--text:#000;--mute:#333;--lime:#000;--gold:#000;--ok:#000;--okbg:#fff}.noprint{display:none!important}.card,.rev,.figs figure{break-inside:avoid}main{max-width:none;padding:0}}
@media(max-width:520px){.opts.tf{grid-template-columns:1fr}.nav .btn,.actions .btn{flex:1 1 100%}main{padding:16px 12px 48px}.card{padding:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main id="app"><noscript>This quiz needs JavaScript enabled to run.</noscript></main>
<script>
(()=>{
"use strict";

/* ---------- Question bank (all items drawn from the three Arnis PDFs) ---------- */
const TOPICS={h:"History and Origins",w:"Terms, Weapons and Equipment",p:"Arnis as a Sport",f:"Fundamentals and Cebuano Grandmasters",s:"Basic Stances",k:"Twelve Striking Techniques"};
const TYPES={mc:"Multiple choice",ms:"Multiple select",tf:"True or false",id:"Identification",match:"Matching"};
const HINTS={mc:"Choose one answer.",ms:"Select all that apply.",tf:"Choose True or False.",id:"Type your answer. Capitalization and punctuation do not matter, and a near answer with at least 2 correct keywords is accepted.",match:"Choose the matching meaning for each term."};
const Q=[];
const m=(t,q,a,w,e)=>Q.push({t,k:"mc",q,a,w,e});
const s=(t,q,a,w,e)=>Q.push({t,k:"ms",q,a,w,e});
const f=(t,q,a,e)=>Q.push({t,k:"tf",q,a,e});
const d=(t,q,a,e)=>Q.push({t,k:"id",q,a:[].concat(a),e});
const x=(t,q,p,e)=>Q.push({t,k:"match",q,p,e});

/* History and Origins */
m("h","Through which law was Arnis declared the Philippine national martial art and sport?","Republic Act 9850",["Republic Act 7160","Republic Act 8293","Republic Act 10533"]);
m("h","On what date was Arnis declared the Philippine National Martial Art and Sport?","December 11, 2009",["December 11, 1989","June 12, 1975","January 8, 1930"]);
m("h","Which president signed Republic Act 9850?","Gloria Macapagal-Arroyo",["Corazon Aquino","Fidel V. Ramos","Benigno Aquino III"]);
m("h","Who crafted and sponsored R.A. 9850, according to the lecture?","Juan Miguel \"Migz\" Zubiri",["Fabian C. Ver","Remy Presas","Dionisio Cañete"]);
m("h","The word Arnis originated from the old Spanish term arnés, which means what?","Armor",["Fencing","Blade","Stick"]);
m("h","Eskrima is a Filipino term derived from the Spanish word esgrima, which means what?","Fencing",["Armor","Dagger","Warrior"]);
m("h","Who created the name KALI in 1948, according to the lecture?","Mirafuente",["Andrea Rollo","Remy Presas","Gen. Fabian C. Ver"],"Mirafuente thought Kali was the root of other terms and the name of the martial art before 1610.");
m("h","What did the Spaniards do once they gained substantial control of the country?","Imposed a total ban on the practice of Arnis",["Made Arnis a required subject in schools","Made Arnis a national sport","Hired Arnis masters as soldiers"],"They were fearful of the Filipinos' exceptional skill.");
m("h","What did the lecture credit for Arnis resurfacing in popularity in the 19th century?","The introduction of Moro-moro plays and dances",["The founding of NARAPHIL","The Philippine Revolution of 1986","The 2005 Southeast Asian Games"],"The plays gave Filipinos cover to practice despite the rule against displaying and carrying bladed weapons.");
m("h","The lecture says modern forms of Filipino martial arts were affected by contact with which two countries after independence in 1898?","The United States and Japan",["China and India","Spain and Portugal","Australia and Korea"]);
m("h","What does the term \"Pintados\" mean?","Painted people",["Warriors","Island dwellers","Stick fighters"],"Spaniards mistakenly thought the tattooed natives of the Visayas were painted.");
m("h","In pre-Hispanic times, what was the role of the bagani?","A warrior class charged with protecting the barangay",["A class of traders","Village priests","Boat builders"]);
f("h","The current form of Arnis has Spanish influence from old fencing, which originated in Spain in the 15th century.",true);
f("h","The lecture says the term Kali came from the pre-Hispanic term Kalis and this was confirmed by Andrea Rollo's study.",false,"The lecture says this was debunked by Andrea Rollo's study.");
f("h","Lapu-Lapu was believed to be one of the foremost masters of Arnis, known at the time as \"Pangamut\".",true);
f("h","The lecture says Dr. Jose Rizal's arnis master (or one of his masters) was Santiago \"Tiago\" Toledo of Pangasinan.",true);
f("h","The lecture says Arnis was declared a national sport by a law signed in 1986.",false,"R.A. 9850 was signed on December 11, 2009.");
d("h","The Spanish word for fencing, from which Eskrima is derived, is ______.",["esgrima"]);
d("h","The tattooed natives of the Visayas were called ______ by the Spanish colonists.",["Pintados","Pintadus"]);
d("h","Dr. Jose Rizal's arnis master was Santiago \"Tiago\" ______.",["Toledo"]);
d("h","Arnis was declared the national martial art and sport on December 11, ______.",["2009"]);
s("h","Select the names the lecture gives for Arnis.",["Eskrima","Kali","Garrote"],["Judo","Savate","Sambo"]);
s("h","Select the places where the Pintados lived, according to the lecture.",["Cebu","Bohol","Eastern part of Negros","Western parts of Leyte"],["Batanes","Palawan","Northern Luzon"]);
x("h","Match each term with its meaning or origin.",[["Arnis","From the old Spanish term arnés, meaning armor"],["Eskrima","From the Spanish word esgrima, meaning fencing"],["Kali","Name created by Mirafuente in 1948"],["Pintados","Spanish term for the tattooed natives of the Visayas"]]);
x("h","Match each regional name for Arnis with its language or region.",[["Kabaraon and Kalirongan","Pangasinan"],["Sinawali","Pampanga"],["Didja","Ilokano"],["Kaliradman or Pagaradman","Bisaya"]]);

/* Terms, Weapons and Equipment */
m("w","What is the ideal length of an Arnis stick, according to the lecture?","75 cm",["50 cm","90 cm","100 cm"]);
m("w","Rattan is usually made from the stem of what?","A Southeast Asian vine",["A palm tree heart","A dark ebony tree","A bamboo grove"]);
m("w","Which wood is described as dark, dense, expensive, and an endangered species of ebony?","Kamagong",["Rattan","Bahi","Baston"]);
m("w","Bahi is made from what part of which plant?","The heart of a palm tree",["The stem of a vine","The trunk of an ebony tree","The root of bamboo"]);
m("w","What are the empty-handed techniques of Arnis generically called?","Suntukan or Pangamot",["Espada y Daga","Likha Anyo","Juego Todo"]);
m("w","What does sikaran refer to?","Kicking",["Hitting with the hands","Grappling","Joint locking"]);
m("w","What is Espada y Daga?","The use of a sword and a dagger",["Two sticks","Bare hands only","A stick and a shield"]);
m("w","What are the gloves in Arnis equipment designed to do?","Protect the hand from strikes while keeping a stable grip and finger flexibility",["Add weight to the strike","Replace the stick","Protect the head only"]);
f("w","The ideal Arnis stick weighs about 200 grams and has a diameter of about 2.4 cm.",true,"These values vary somewhat with the size of the practitioner.");
f("w","Bahi is much denser and heavier than kamagong.",false,"Bahi is similar to kamagong but is made of a porous material in weight and density.");
f("w","The Arnis groin protector has a groin cup to give complete protection to the groin area.",true);
f("w","Rubber mats are designed to absorb impact from jumping, rolling, falling, and slamming without injury.",true);
d("w","The butt of the stick is called the ______.",["punyo"]);
d("w","Olisi, Baston, Garote, and Yantok are other terms for Arnis ______.",["sticks","stick"]);
d("w","The empty-handed term for hitting with the hands is ______.",["suntukan"]);
d("w","The empty-handed term for joint manipulation, locking, and breaking is ______.",["trancada"]);
s("w","Select the traditional materials for wooden sticks.",["Rattan","Kamagong","Bahi"],["Pine","Cast iron","Fiberglass"]);
s("w","Select the edged weapons named in the lecture.",["Baraw (dagger)","Bolo","Barong","Kampilan"],["Nunchaku","Tonfa","Katana"]);
x("w","Match each piece of equipment with its description.",[["Head gear","Leatherette and vinyl cover with a metal frame for impact protection"],["Body armor","Upper body protection made of hard plastic and vinyl"],["Leg guard","Protects both the thigh and the shin"],["Hand gloves","Thick rubber protection with an open palm design"],["Rubber mats","Absorb impact from jumping, rolling, and falling"]]);

/* Arnis as a Sport */
m("p","Who founded the National Arnis Association of the Philippines (NARAPHIL), and when?","Gen. Fabian C. Ver in 1975",["Remy Presas in 1989","Dionisio Cañete in 1986","Juan Miguel Zubiri in 2009"]);
m("p","When was the World Eskrima Kali Arnis Federation (WEKAF) established?","1989",["1975","1986","2005"]);
m("p","The Arnis Philippines System (ARPI) was used prominently during which event?","The 2005 Southeast Asian Games",["The 1986 EDSA Revolution","The 2009 signing of R.A. 9850","The 1989 WEKAF founding"]);
m("p","Which scoring system does WEKAF use?","The 10-point must system, similar to boxing",["A scoring system similar to fencing","A first-to-three-hits system","A time-based system"]);
m("p","ARPI adapted a scoring system similar to which sport?","Fencing",["Boxing","Judo","Wrestling"]);
m("p","What are the sizes of the competition area and the playing area?","Competition area 10 by 10 meters; playing area 8 by 8 meters",["Competition area 8 by 8 meters; playing area 10 by 10 meters","Competition area 12 by 12 meters; playing area 10 by 10 meters","Competition area 6 by 6 meters; playing area 4 by 4 meters"]);
m("p","Who uses the yellow flag in a competition?","The timer",["The referee","The judges","The scorekeeper"],"It signals the start and end of each round, a time-out, and the resumption of the game.");
m("p","What is Likha Anyo?","The application of the art by showcasing strikes and stances as a performing art",["Rapid-style sparring","A type of stick","A scoring method"]);
m("p","Who founded Modern Arnis?","The late Remy Presas",["Ernesto Presas","Venancio Bacon","Timoteo Maranga"]);
m("p","What did Ernesto Presas call his system starting in 1999?","Kombatan",["Balintawak","Doce Pares","Larga Mano"]);
f("p","In WEKAF, hitting below the thigh is strictly prohibited.",true);
f("p","In ARPI, participants use live sticks instead of padded sticks.",false,"ARPI participants use padded sticks with light rattan cores in place of live sticks.");
f("p","In ARPI, points can be scored by disarming the opponent or forcing them out of the ring.",true);
f("p","The FMA7 program is run by the Department of Tourism Central Visayas to develop and promote Filipino Martial Arts.",true);
d("p","WEKAF stands for ______. Write the full name.",["World Eskrima Kali Arnis Federation"]);
d("p","Rapid-style sparring is called Juego ______.",["Todo"]);
d("p","The goal of Modern Arnis was an injury-free training method and an effective ______ system.",["self-defense","self defense"]);
s("p","Select the Arnis sports organizations or systems named in the lecture.",["NARAPHIL","WEKAF","ARPI"],["FIFA","FIBA","IOC"]);
x("p","Match each organization or person with its detail.",[["NARAPHIL","Founded in 1975 by Gen. Fabian C. Ver"],["WEKAF","Established in 1989 and recognized internationally"],["ARPI","Established in 1986 with fencing-like scoring"],["Modern Arnis","Founded by the late Remy Presas"]]);

/* Fundamentals and Cebuano Grandmasters */
m("f","How far from the punyo should the stick be held?","One fist away",["Two fists away","At the very end","Halfway along the stick"],"Close the grip with the thumb.");
m("f","In Handa, how are the feet positioned?","Shoulder width apart, with the stick held in front of the body",["One foot far in front","Heels together","Feet crossed"]);
m("f","What is Pugay?","A bow, done with the weapon hand across the chest",["A fighting stance","A kind of strike","A scoring method"]);
m("f","In Handa sa Paglaban (fighting stance), which foot is in front?","The foot the same as the weapon hand",["The foot opposite the weapon hand","Neither; feet are side by side","Either, chosen at random"]);
m("f","Who is the Supreme Grandmaster of the Doce Pares Multisystem?","Dionisio Cañete",["Filemon Caburnay","Timoteo Maranga","Bobby Taboada"]);
m("f","Who is the founder of the Balintawak System?","Venancio \"Anciong\" Bacon",["Vicente \"Inting\" Carin","Filemon \"Momoy\" Cañete","Nicomedes \"Nick\" Eliazar"]);
m("f","Which grandmaster is linked to the San Miguel System?","Filemon \"Momoy\" Cañete",["Ciriaco \"Cacoy\" Cañete","Timoteo Maranga","Filemon Caburnay"]);
m("f","Which system is led by Ciriaco \"Cacoy\" Cañete?","Cacoy Doce Pares",["Eskrima Carin","Combat Eskrima Maranga","Cuentada Balintawak"]);
m("f","Who is associated with Combat Eskrima Maranga?","Timoteo Maranga",["Vicente Carin","Bobby Taboada","Nick Eliazar"]);
m("f","Who is associated with Lapunti Arnis de Abanico?","Filemon Caburnay",["Timoteo Maranga","Nick Eliazar","Venancio Bacon"]);
f("f","In the fighting stance, the feet are kept apart at a distance of one foot.",true);
f("f","About 90% of the more than 30 FMA systems in Central Visayas are based in Cebu.",true);
d("f","Bowing with the weapon hand across the chest is called ______.",["Pugay"]);
d("f","The standing-ready position with feet shoulder width apart is called ______.",["Handa"]);
d("f","Grandmaster Bobby ______ leads the Cuentada Balintawak System.",["Taboada"]);
d("f","Grandmaster Nicomedes \"Nick\" ______ leads Nicklestick Balintawak.",["Eliazar"]);
s("f","Select the Arnis systems or styles listed in the lecture.",["Arnis de Abanico","Corto Linear","Corto Corvada","Larga Mano"],["Kenpo","Aikido","Savate"]);
x("f","Match each Cebuano grandmaster with his system.",[["Dionisio Cañete","Doce Pares Multisystem"],["Venancio Bacon","Balintawak System"],["Timoteo Maranga","Combat Eskrima Maranga"],["Filemon Caburnay","Lapunti Arnis de Abanico"],["Vicente \"Inting\" Carin","Eskrima Carin"]]);

/* Basic Stances */
m("s","Which stance is the most commonly used when standing at ease?","Ready stance",["Forward stance","Back stance","Straddle stance"],"The feet are parallel to the shoulders with toes pointing forward.");
m("s","In the attention stance, how are the feet positioned?","Forming a 45-degree angle, with heels close to each other",["Parallel and shoulder width apart","Far apart with legs extended","One foot directly behind the other"]);
m("s","What is the attention stance usually used for?","Courtesy in preparation for a fight, before sparring",["Striking and blocking","Moving backward","Disarming an opponent"]);
m("s","In the forward stance, what must be in line with each other?","The toes and the knee",["The heels and the shoulders","The elbows and the hips","The toes and the opposite heel"]);
m("s","What does the lecture say about weight in the forward stance?","It should be distributed equally on both legs",["It should rest on the front leg only","It should rest on the back leg only","It should be on the toes"]);
m("s","In the oblique stance, the foot is moved at what angle?","45 degrees",["30 degrees","90 degrees","180 degrees"]);
m("s","What is the moving foot called in the oblique stance?","The lead foot",["The base foot","The rear foot","The anchor foot"]);
m("s","In the straddle stance, how far is the foot moved to the left or right?","2 feet",["1 foot","3 feet","4 feet"],"The lower legs end up perpendicular to the ground.");
m("s","Which stance is very close to the straddle stance, but keeps the moving foot perpendicular to the ground while the other leg is extended?","Side stance",["Back stance","Oblique stance","Attention stance"]);
m("s","In the back stance, the heels form an imaginary shape of which letter?","L",["V","T","X"]);
m("s","How many basic stances does the lecture present?","Seven",["Four","Five","Twelve"]);
f("s","In the forward stance, the foot should be extended very far and the body kept very low.",false,"The lecture warns against extending the foot too far or lowering the body too much, since it makes maneuvering and attacking hard.");
f("s","The forward stance has two types, depending on whether the right or left foot is extended to the front.",true);
f("s","In the back stance, it is very important not to extend the foot too far.",true);
f("s","In the ready stance, the knees are kept straight and the whole body faces forward.",true);
d("s","The stance done with feet at a 45-degree angle and heels close together is the ______ stance.",["attention"]);
d("s","The stance in which the toes and knee are in line and one foot moves to the front is the ______ stance.",["forward"]);
d("s","In the oblique stance, the moving foot is called the ______ foot.",["lead"]);
d("s","The back stance forms an imaginary \"__\" shape with the heels. Write the letter.",["L"]);
s("s","Select the stances presented in the lecture.",["Ready stance","Attention stance","Oblique stance","Straddle stance"],["Horse stance","Cat stance","Crane stance"]);
x("s","Match each stance with its description.",[["Ready stance","Feet parallel to the shoulders; toes forward; hands at waist level"],["Attention stance","Feet at 45 degrees with heels close; used for courtesy before sparring"],["Forward stance","One foot to the front until toes and knee are in line"],["Oblique stance","One foot moved at 45 degrees to become the lead foot"],["Straddle stance","A foot moved 2 feet sideways until the lower legs are perpendicular to the ground"],["Back stance","Foot extended to the back at 45 degrees; heels form an imaginary L"]]);

/* Twelve Striking Techniques */
m("k","How many basic striking techniques are presented in the lecture?","Twelve",["Six","Eight","Ten"]);
m("k","Which three actions are used to hit the vital points of the body in the twelve strikes?","Slashing, stabbing, and thrusting",["Blocking, locking, and grappling","Kicking, punching, and sweeping","Twirling, bowing, and spinning"]);

const app=document.getElementById("app");
function h(tag,props,...kids){
  const el=document.createElement(tag);
  for(const k in props||{}){
    const v=props[k];
    if(k==="class")el.className=v;
    else if(k.slice(0,2)==="on")el.addEventListener(k.slice(2),v);
    else if(v===true)el.setAttribute(k,"");
    else if(v!==false&&v!=null)el.setAttribute(k,v);
  }
  for(const c of kids.flat())if(c!=null&&c!==false)el.append(c.nodeType?c:document.createTextNode(c));
  return el;
}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
/* Case-insensitive, punctuation-insensitive, whitespace-insensitive comparison */
const norm=v=>String(v).toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[-_\/]/g," ").replace(/[^a-z0-9\s]/g,"").replace(/\s+/g," ").trim().replace(/^(the|a|an) /,"");
const same=(a,b)=>{const p=norm(a),q=norm(b);return !!q&&(p===q||p.replace(/ /g,"")===q.replace(/ /g,""))};

/* Near-answer matching: at least 2 keywords (or the single keyword if the answer has only one) */
const STOP=new Set("a an the of and or to in on for is are was be by with as at from that this its it".split(" "));
const keys=v=>norm(v).split(" ").filter(w=>w&&!STOP.has(w));
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function near(correct,typed){
  const kw=keys(correct),uw=keys(typed);
  if(!kw.length||!uw.length)return false;
  const hits=kw.filter(k=>uw.some(w=>w===k||(k.length>=6&&w.length>=6&&lev(w,k)<=1))).length;
  return hits>=Math.min(2,kw.length);
}
const idOk=(q,a)=>q.a.some(v=>same(v,a)||near(v,a));

/* ---------- State ---------- */
const S={cfg:{topics:new Set(Object.keys(TOPICS)),types:new Set(Object.keys(TYPES)),n:10,mode:"instant"},items:[],i:0,view:"all"};
let ui={};
const pool=()=>Q.filter(q=>S.cfg.topics.has(q.t)&&S.cfg.types.has(q.k));
function prep(q){
  const it={q,ans:null,done:false,ok:false};
  if(q.k==="mc")it.opts=shuffle([q.a,...q.w]);
  if(q.k==="ms"){it.opts=shuffle([...q.a,...q.w]);it.ans=[]}
  if(q.k==="id")it.ans="";
  if(q.k==="match"){it.defs=shuffle(q.p.map(p=>p[1]));it.ans=q.p.map(()=>"")}
  return it;
}
const filled=it=>{const k=it.q.k,a=it.ans;return k==="ms"?a.length>0:k==="match"?a.every(Boolean):k==="id"?a.trim()!=="":a!==null};
function grade(it){
  const q=it.q,a=it.ans;
  switch(q.k){
    case "mc":return a===q.a;
    case "tf":return a===q.a;
    case "ms":return a.length===q.a.length&&q.a.every(v=>a.includes(v));
    case "id":return idOk(q,a);
    case "match":return q.p.every((p,i)=>a[i]===p[1]);
  }
}
function correctLines(it){
  const q=it.q;
  if(q.k==="tf")return[q.a?"True":"False"];
  if(q.k==="ms")return q.a;
  if(q.k==="id")return[q.a[0]];
  if(q.k==="match")return q.p.map(p=>p[0]+": "+p[1]);
  return[q.a];
}
function userLines(it){
  const q=it.q,a=it.ans;
  if(!filled(it)&&q.k!=="match")return[];
  if(q.k==="tf")return[a?"True":"False"];
  if(q.k==="ms")return a;
  if(q.k==="match")return q.p.map((p,i)=>p[0]+": "+(a[i]||"(no answer)"));
  return[a];
}

/* ---------- Answer sheet ---------- */
function answers(key){
  key=key||"all";
  const tops=key==="all"?Object.keys(TOPICS):[key];
  const chips=["all",...Object.keys(TOPICS)].map(k=>h("button",{class:"chip",type:"button","aria-pressed":String(k===key),onclick:()=>answers(k)},k==="all"?"All topics":TOPICS[k]));
  const body=[];
  tops.forEach(t=>{
    const qs=Q.filter(q=>q.t===t);
    body.push(h("h2",{style:"margin:22px 0 10px;font-size:1.35rem;color:var(--gold)"},TOPICS[t]+" ("+qs.length+")"));
    const gal=t==="s"?STANCEKEYS:t==="k"?["diagram",...STRIKEKEYS]:null;
    if(gal)body.push(h("div",{class:"card"},h("h3",{},"Photo key"),figs(gal)));
    qs.forEach((q,i)=>{
      const lines=correctLines({q});
      body.push(h("article",{class:"rev ok"},
        h("div",{class:"revhead"},h("strong",{},(i+1)+"."),h("span",{class:"qtype"},TYPES[q.k])),
        h("p",{class:"rq"},q.q),
        h("div",{class:"ans"},h("b",{},"Answer"),lines.map(l=>h("div",{},l))),
        q.e?h("p",{class:"ex"},q.e):null));
    });
  });

    h("div",{class:"top noprint"},h("span",{class:"brand"},"Answer Sheet"),h("button",{class:"btn sec sm",type:"button",onclick:setup},"Back")),
    h("div",{class:"chips noprint"},chips),

    h("div",{class:"card"},h("fieldset",{},h("legend",{},"Number of items"),h("div",{class:"chips"},chips),h("div",{class:"row"},h("label",{for:"count"},"Custom"),num),hint)),
    start,
    h("div",{class:"actions"},h("button",{class:"btn sec",type:"button",onclick:()=>study()},"Study reviewer"),h("button",{class:"btn sec",type:"button",onclick:()=>answers()},"Answer sheet"))
  );
  refresh();top();
}
function begin(){
  const p=pool();if(!p.length)return;
  const n=Math.min(Math.max(S.cfg.n,1),p.length);
  S.items=shuffle(p).slice(0,n).map(prep);S.i=0;S.view="all";quiz();
}

/* ---------- Quiz screen ---------- */
function bodyFor(it,locked){
  const q=it.q,k=q.k;
  if(k==="id"){
    const cls=locked?(it.ok?"ok":"bad"):"";
    return h("input",{type:"text",class:cls,value:it.ans,disabled:locked,autocomplete:"off",autocapitalize:"off",autocorrect:"off",spellcheck:"false",enterkeyhint:"done","aria-label":"Your answer",
      oninput:e=>{it.ans=e.target.value;sync()},
      onkeydown:e=>{if(e.key!=="Enter")return;e.preventDefault();enter()}});
  }
  if(k==="match"){
    return h("div",{class:"match"},q.p.map((p,i)=>h("div",{},
      h("label",{for:"m"+i},p[0]),
      h("select",{id:"m"+i,disabled:locked,class:locked?(it.ans[i]===p[1]?"ok":"bad"):"",onchange:e=>{it.ans[i]=e.target.value;sync()}},
        h("option",{value:"",selected:!it.ans[i]},"Choose..."),
        it.defs.map(v=>h("option",{value:v,selected:it.ans[i]===v},v))))));
  }
  const multi=k==="ms",opts=k==="tf"?[true,false]:it.opts;
  return h("div",{class:"opts"+(k==="tf"?" tf":"")},opts.map(o=>{
    const on=multi?it.ans.includes(o):it.ans===o;
    const corr=multi?q.a.includes(o):q.a===o;
    const cls="opt"+(locked?(corr?" ok":on?" bad":""):"");
    return h("label",{class:cls},
      h("input",{type:multi?"checkbox":"radio",name:"o",checked:on,disabled:locked,onchange:e=>{
        if(multi)it.ans=e.target.checked?[...it.ans,o]:it.ans.filter(v=>v!==o);else it.ans=o;sync()}}),
      h("span",{},k==="tf"?(o?"True":"False"):o));
  }));
}
function quiz(){
  const inst=S.cfg.mode==="instant",N=S.items.length,it=S.items[S.i],q=it.q,last=S.i===N-1;
  const right=S.items.filter(v=>v.done&&v.ok).length,seen=S.items.filter(v=>v.done).length;
  const locked=inst&&it.done;
  ui={};
  ui.stat=h("span",{},inst?`Score ${right} of ${seen}`:`${S.items.filter(filled).length} of ${N} answered`);
  ui.chk=h("button",{class:"btn",type:"button",onclick:check,disabled:!filled(it)},"Done");
  const nextBtn=h("button",{class:"btn",type:"button",onclick:()=>last?finish():go(S.i+1)},last?(inst?"See results":"Finish quiz"):"Next");
  const nav=h("div",{class:"nav"},inst?(it.done?nextBtn:ui.chk):[h("button",{class:"btn sec",type:"button",disabled:S.i===0,onclick:()=>go(S.i-1)},"Previous"),nextBtn]);
  let fb=null;
  if(locked){
    const lines=correctLines(it);
    fb=h("div",{class:"fb "+(it.ok?"ok":"bad"),role:"status"},
      h("strong",{},it.ok?"Correct!":"Incorrect"),
      it.ok&&q.k==="id"&&!q.a.some(v=>same(v,it.ans))?h("p",{},"Accepted as a near answer. Full answer: "+q.a[0]):null,
      it.ok?null:h("p",{},"Correct answer: ",q.k==="match"||q.k==="ms"?lines.map((l,i)=>h("span",{},i?h("br"):null,l)):lines[0]),
      q.e?h("p",{},q.e):null);
  }
  if(!inst)ui.map=h("div",{class:"map"},S.items.map((v,i)=>h("button",{type:"button",class:(filled(v)?"done ":"")+(i===S.i?"cur":""),"aria-label":"Go to item "+(i+1),"aria-current":i===S.i?"step":null,onclick:()=>go(i)},i+1)));
  app.replaceChildren(
    h("div",{class:"top"},h("span",{class:"brand"},"Arnis Quiz"),h("button",{class:"btn sec sm",type:"button",onclick:quit},"Quit")),
    h("div",{class:"bar",role:"progressbar","aria-valuemin":0,"aria-valuemax":N,"aria-valuenow":seen},h("i",{style:`width:${(inst?seen:S.items.filter(filled).length)/N*100}%`})),
    h("div",{class:"qhead"},h("span",{},`Item ${S.i+1} of ${N}`),ui.stat),
    h("section",{class:"card"},
      h("span",{class:"qtype"},TYPES[q.k]),
      h("h2",{class:"qtext",tabindex:-1},q.q),
      h("p",{class:"hintline",style:"margin:0 0 14px"},HINTS[q.k]),
      bodyFor(it,locked),fb,nav),
    ...(ui.map?[ui.map]:[])
  );
  if(fb)fb.scrollIntoView({block:"nearest"});
}
function sync(){
  const it=S.items[S.i];
  if(ui.chk)ui.chk.disabled=!filled(it);
  if(ui.map)[...ui.map.children].forEach((b,i)=>b.classList.toggle("done",filled(S.items[i])));
  if(S.cfg.mode==="end"){
    const n=S.items.filter(filled).length;
    ui.stat.textContent=`${n} of ${S.items.length} answered`;
    document.querySelector(".bar i").style.width=n/S.items.length*100+"%";
  }
}
function enter(){
  const it=S.items[S.i];
  if(S.cfg.mode==="instant"){if(it.done)S.i===S.items.length-1?finish():go(S.i+1);else if(filled(it))check()}
  else if(S.i<S.items.length-1)go(S.i+1);
}
function check(){const it=S.items[S.i];if(!filled(it)||it.done)return;it.done=true;it.ok=grade(it);quiz()}
function go(i){S.i=i;quiz();top();const t=document.querySelector(".qtext");if(t)t.focus({preventScroll:true})}
function quit(){
  const old=document.getElementById("quitbox");if(old){old.remove();return}
  const box=h("div",{class:"card",id:"quitbox",role:"alertdialog","aria-label":"Leave quiz"},
    h("p",{style:"margin-bottom:12px"},"Leave this quiz? Your progress will be lost."),
    h("div",{class:"row"},
      h("button",{class:"btn sm",type:"button",onclick:setup},"Yes, leave"),
      h("button",{class:"btn sec sm",type:"button",onclick:()=>box.remove()},"Keep going")));
  document.querySelector(".top").after(box);
}
function finish(){
  if(S.cfg.mode==="end"){
    const un=S.items.filter(v=>!filled(v)).length;
    
    S.items.forEach(v=>{v.ok=filled(v)&&grade(v);v.done=true});
  }
  results();
}

/* ---------- Results ---------- */
function breakdown(title,key,names){
  const o={};
  S.items.forEach(v=>{const g=v.q[key];o[g]=o[g]||[0,0];o[g][1]++;if(v.ok)o[g][0]++});
  return h("div",{class:"card"},h("h3",{},title),h("table",{},h("tbody",{},Object.keys(o).map(g=>
    h("tr",{},h("td",{},names[g]),h("td",{class:"num"},o[g][0]+" / "+o[g][1]),h("td",{class:"num"},Math.round(o[g][0]/o[g][1]*100)+"%"))))));
}
function results(){
  const N=S.items.length,ok=S.items.filter(v=>v.ok).length,pct=Math.round(ok/N*100);
  const msg=pct>=90?"Excellent. You know this material well.":pct>=75?"Good work. A quick review will close the gaps.":pct>=50?"Fair start. Review the missed items below and try again.":"Go back through the Arnis slides, then retake the quiz.";
  const list=h("div");
  const chips=["all","missed"].map(v=>h("button",{class:"chip",type:"button","aria-pressed":String(S.view===v),onclick:()=>{S.view=v;chips.forEach((b,i)=>b.setAttribute("aria-pressed",String(["all","missed"][i]===v)));draw()}},v==="all"?"All items":"Missed only"));
  function draw(){
    const rows=S.items.map((v,i)=>[v,i]).filter(([v])=>S.view==="all"||!v.ok);
    list.replaceChildren(...(rows.length?rows.map(([v,i])=>{
      const un=!filled(v),ul=userLines(v);
      return h("article",{class:"rev "+(v.ok?"ok":"bad")},
        h("div",{class:"revhead"},h("strong",{},`${i+1}. ${v.ok?"Correct":un?"Not answered":"Incorrect"}`),h("span",{class:"qtype"},TYPES[v.q.k])),
        h("p",{class:"rq"},v.q.q),
        h("div",{class:"ans"},h("b",{},"Your answer"),ul.length?ul.map(l=>h("div",{},l)):h("div",{},"No answer")),
        v.ok?null:h("div",{class:"ans"},h("b",{},"Correct answer"),correctLines(v).map(l=>h("div",{},l))),
        v.q.e?h("p",{class:"ex"},v.q.e):null);
    }):[h("p",{class:"sub"},"Nothing missed. Every item was correct.")]));
  }
  app.replaceChildren(
    h("div",{class:"card center"},h("h1",{},"Results"),h("div",{class:"score"},pct+"%"),h("p",{class:"sub",style:"margin:10px auto 0"},`${ok} of ${N} correct. ${msg}`)),
    h("div",{class:"actions"},
      h("button",{class:"btn",type:"button",onclick:()=>{S.items=shuffle(S.items.map(v=>v.q)).map(prep);S.i=0;S.view="all";quiz();top()}},"Retake these items"),
      h("button",{class:"btn sec",type:"button",onclick:setup},"New quiz")),
    breakdown("By topic","t",TOPICS),breakdown("By question type","k",TYPES),
    h("h3",{style:"margin:22px 0 10px"},"Review"),h("div",{class:"chips"},chips),list
  );
  draw();top();
}

setup();
})();
</script>
